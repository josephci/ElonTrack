name: Hourly Elon Tracker Screenshot

on:
  schedule:
    # 💡 使用 Cron 定時任務：每小時的 0 分執行一次 (注意：GitHub Actions 的時間是 UTC 時間)
    - cron: '0 * * * *'
  workflow_dispatch: # 允許你在 GitHub 網頁上手動點擊按鈕立即觸發執行

jobs:
  screenshot-and-save:
    runs-on: ubuntu-22.04
    
    # 授予工作流將新截圖提交回倉庫的權限
    permissions:
      contents: write

    steps:
    - name: 檢查程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝 Python 套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 安裝 Playwright 瀏覽器核心
      run: |
        playwright install chromium --with-deps

    - name: 執行截圖與傳送腳本
      env:
        # 將剛剛在 GitHub 網頁設定的 Secrets 帶入環境變數中
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python tracker.py

    - name: 將新截圖自動提交(Commit)存回 GitHub 倉庫
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 💡 安全檢查 1：確保 screenshots 資料夾存在，避免 git add 找不到路徑
        mkdir -p screenshots
        
        # 💡 安全檢查 2：檢查資料夾內是否有任何 .png 檔案
        if [ -n "$(ls -A screenshots/*.png 2>/dev/null)" ]; then
          git add screenshots/*.png
          
          # 只有在真的有圖表檔案被修改或新增時，才執行 commit 與 push
          if ! git diff --cached --quiet; then
            git commit -m "🤖 自動備份: 新增每小時截圖 [skip ci]"
            git push
          else
            echo "圖片內容沒有變化，跳過本次提交。"
          fi
        else
          echo "⚠️ 警告：在 screenshots 資料夾中找不到任何 PNG 檔案，可能是截圖失敗了！"
        fi
